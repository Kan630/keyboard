<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyboard Master — Keyboard Trainer</title>
  <link rel="icon" type="image/png" sizes="32x32" href="img/driot_keyboard_favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1><img src="img/driot_keyboard_icon.png" alt="">Keyboard Master</h1>
  <p class="tagline">Learn to type without looking — audio guided</p>
</header>

<div class="mode-bar">
  <button class="mode-card" id="btnModeFree">
    <span class="mode-icon">⌨️</span>
    <span class="mode-name">Free Typing</span>
    <span class="mode-desc">Practice without scoring</span>
  </button>
  <button class="mode-card" id="btnModeSentence">
    <span class="mode-icon">📝</span>
    <span class="mode-name">Writer</span>
    <span class="mode-desc">Type displayed text</span>
  </button>
  <button class="mode-card" id="btnModeAccount">
    <span class="mode-icon">🔢</span>
    <span class="mode-name">Accountant</span>
    <span class="mode-desc">Numpad figures &amp; operators</span>
  </button>
</div>

<div class="theme-bar" id="themeBar" hidden>
  <label for="themeSel">Theme</label>
  <select id="themeSel"></select>
</div>

<div class="controls">
  <div class="ctrl-row">
    <div class="ctrl-group">
      <label for="layoutSel">Layout</label>
      <select id="layoutSel"></select>
    </div>
    <button id="btnBlind">👁 Show keyboard</button>
  </div>
  <div class="ctrl-row">
    <button id="btnAudio">🔇 Audio</button>
    <div class="ctrl-group">
      <label for="voiceSel">Voice</label>
      <select id="voiceSel"></select>
    </div>
    <button id="btnAudioMode">Per word</button>
  </div>
</div>

<div class="kb-wrap" id="kbWrap">
  <div class="kb-main-row">
    <div class="keyboard" id="keyboard"></div>
    <div class="keyboard" id="numpad" hidden></div>
  </div>
</div>

<div class="exercise-panel" id="exercisePanel" hidden>
  <div class="ex-controls">
    <div class="ex-sent-btns">
      <button id="btnExSee" class="on">See</button>
      <button id="btnExHear">Hear</button>
      <button id="btnExBoth">Both</button>
      <button id="btnRepeat" title="Repeat sentence">↺ Repeat</button>
    </div>
    <button id="btnNewSentence">↺ New sentence</button>
  </div>
  <div class="exercise-target" id="exerciseTarget"></div>
  <div class="ex-sent-stats" id="exSentenceStats" hidden></div>
</div>

<div class="practice">
  <div class="display" id="display"><span class="cursor"></span></div>
  <div class="stats">
    <div class="stat"><div class="val" id="wpm">0</div><div class="lbl">WPM</div></div>
    <div class="stat"><div class="val" id="keyCount">0</div><div class="lbl">Keys</div></div>
    <div class="stat"><div class="val" id="duration">0s</div><div class="lbl">Time</div></div>
    <div class="stat" id="statErrors" hidden><div class="val" id="errCount">0</div><div class="lbl">Corrections</div></div>
  </div>
  <div class="practice-footer">
    <button id="btnClear">Clear</button>
  </div>
</div>

<div class="hof-panel" id="hofPanelSentence" hidden>
  <h2>📝 Writer — Hall of Fame</h2>
  <div class="hof-sub" id="hofMyRecordsSentence" hidden>
    <div class="hof-sub-title">👤 <span id="hofMyNameSentence"></span> — My Records</div>
    <table class="hof-table" id="hofTableMySentence"></table>
  </div>
  <div class="hof-sub" id="hofGlobalSentence" hidden>
    <div class="hof-sub-title">🌍 All users · All-time bests</div>
    <table class="hof-table" id="hofTableGlobalSentence"></table>
  </div>
</div>

<div class="hof-panel" id="hofPanelAccount" hidden>
  <h2>🔢 Accountant — Hall of Fame</h2>
  <div class="hof-sub" id="hofMyRecordsAccount" hidden>
    <div class="hof-sub-title">👤 <span id="hofMyNameAccount"></span> — My Records</div>
    <table class="hof-table" id="hofTableMyAccount"></table>
  </div>
  <div class="hof-sub" id="hofGlobalAccount" hidden>
    <div class="hof-sub-title">🌍 All users · All-time bests</div>
    <table class="hof-table" id="hofTableGlobalAccount"></table>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal">
    <h2>Completed!</h2>
    <div class="modal-stats" id="modalStats"></div>
    <input type="text" id="playerName" placeholder="Your name… (Enter to confirm)" maxlength="24" autocomplete="off">
    <div class="modal-actions">
      <button id="btnNextEx">Next sentence →</button>
    </div>
  </div>
</div>

<div class="badge" id="badge"></div>
<div class="badge" id="versionBadge"></div>
<div class="badge" id="playerBadge" hidden></div>

<script src="layouts.js"></script>
<script src="sentences.js"></script>
<script>
// ═══════════════════════════════════════════════════════════
//  CONFIG  — change per server instance
// ═══════════════════════════════════════════════════════════
const CONFIG = {
  instance:      "driot.com · A",   // shown in badge bottom-right
  version:       "v0.92.01",
  defaultLayout: "ch-fr-qwertz",
  audioOn:       false,
  speechRate:    0.88,
  preferLang:    "fr",              // preferred TTS language prefix
};

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
let layout         = LAYOUTS[CONFIG.defaultLayout];
let audioOn        = CONFIG.audioOn;
let audioMode      = "word";    // "key" | "word"
let blindMode      = false;
let numpadVisible  = false;
let numpadDetected = false;
let mode           = "free";    // "free" | "sentence" | "accountant"
let sentPackKey    = CONFIG.preferLang === "fr" ? "fr" : "en";
let exSentMode     = "see";     // "see" | "hear" | "both"
let exSentence     = "";
let exTyped        = [];
let exBackspaces   = 0;
let exStartTime    = null;
let exTimerID      = null;
let exCompleted    = false;
let exLastResults  = null;
let typed      = [];
let cursorPos  = 0;
let selAnchor  = null;
let startTime  = null;
let timerID    = null;
let deadKey    = null;
let voices     = [];
let voice      = null;
const mods     = { shift: false, altgr: false, caps: false };
const held     = new Set();

// ═══════════════════════════════════════════════════════════
//  DEAD KEY COMPOSITION
// ═══════════════════════════════════════════════════════════
function composeChar(ch) {
  if (deadKey) {
    const composed = DEAD_COMPOSE[deadKey]?.[ch];
    const prefix   = composed ? null : deadKey;
    deadKey = null;
    return composed ? [composed] : [prefix, ch].filter(Boolean);
  }
  if (ch in DEAD_COMPOSE) { deadKey = ch; return []; }
  return [ch];
}

function getSelBounds() {
  if (selAnchor === null) return null;
  return { start: Math.min(selAnchor, cursorPos), end: Math.max(selAnchor, cursorPos) };
}

function charSpoken(ch) {
  const map = layout.lang.startsWith("fr") ? SPOKEN_FR : SPOKEN_EN;
  return map[ch] ?? ch;
}

// ═══════════════════════════════════════════════════════════
//  SPEECH
// ═══════════════════════════════════════════════════════════
function voiceQuality(v) {
  const n = v.name.toLowerCase();
  if (/espeak|festival|mbrola/.test(n)) return 2;
  if (/google|microsoft|apple|premium|neural|natural/.test(n)) return 0;
  return 1;
}

function loadVoices() {
  const raw = speechSynthesis.getVoices();
  voices = [...raw].sort((a, b) => {
    const prefA = a.lang.startsWith(CONFIG.preferLang) ? 0 : 1;
    const prefB = b.lang.startsWith(CONFIG.preferLang) ? 0 : 1;
    if (prefA !== prefB) return prefA - prefB;
    return voiceQuality(a) - voiceQuality(b);
  });
  const sel = document.getElementById("voiceSel");
  sel.innerHTML = "";
  voices.forEach((v, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = `${v.name} (${v.lang})`;
    sel.appendChild(o);
  });
  voice = voices[0] ?? null;
}

speechSynthesis.addEventListener("voiceschanged", loadVoices);
loadVoices();

document.getElementById("voiceSel").addEventListener("change", e => {
  voice = voices[+e.target.value] ?? null;
});

function speak(ch) {
  if (!audioOn || !ch) return;
  if (audioMode === "word") {
    if (/[ \n.,;:!?]/.test(ch)) {
      const all  = typed.join("");
      // For punctuation, strip the just-typed char so it isn't part of the word
      const text = (ch === " " || ch === "\n") ? all.trim() : all.slice(0, -1).trim();
      const words = text.split(/[\s\n.,;:!?]+/);
      const last  = words[words.length - 1];
      if (!last) return;
      speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(last);
      utt.rate = CONFIG.speechRate;
      utt.lang = layout.lang;
      if (voice) utt.voice = voice;
      speechSynthesis.speak(utt);
    }
    return;
  }
  if (speechSynthesis.pending) return;
  const utt = new SpeechSynthesisUtterance(charSpoken(ch));
  utt.rate = CONFIG.speechRate * 1.6;
  utt.lang = layout.lang;
  if (voice) utt.voice = voice;
  speechSynthesis.speak(utt);
}

function speakSentence(text) {
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate  = CONFIG.speechRate * 0.85;
  utt.lang  = layout.lang;
  if (voice) utt.voice = voice;
  speechSynthesis.speak(utt);
}

// ═══════════════════════════════════════════════════════════
//  KEYBOARD RENDER
// ═══════════════════════════════════════════════════════════
function x(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

const HOME_ROW_KEYS = new Set(["KeyA","KeyS","KeyD","KeyF","KeyJ","KeyK","KeyL","Semicolon"]);

function renderKeyboard() {
  const kb = document.getElementById("keyboard");
  kb.innerHTML = "";
  layout.rows.forEach(rowDef => {
    const row = document.createElement("div");
    row.className = "kb-row";
    rowDef.forEach(([code, w = "", label]) => {
      const el = document.createElement("div");
      const homeClass = HOME_ROW_KEYS.has(code) ? " home-row" : "";
      el.className = "key" + (w ? " " + w : "") + homeClass;
      el.dataset.code = code;
      if (label !== undefined) {
        el.innerHTML = `<span class="sp">${label}</span>`;
      } else {
        const lyr  = layout.keys[code] ?? [];
        const def  = lyr[0] ?? "";
        const shft = lyr[1] ?? "";
        const agr  = lyr[2] ?? "";
        el.innerHTML =
          (shft ? `<span class="shft">${x(shft)}</span>` : "") +
          (agr  ? `<span class="agr">${x(agr)}</span>`   : "") +
          `<span class="main">${x(def)}</span>`;
      }
      row.appendChild(el);
    });
    kb.appendChild(row);
  });
}

function setActive(code, on) {
  document.querySelectorAll(`.key[data-code="${code}"]`).forEach(el => el.classList.toggle("active", on));
}

function renderNumpad() {
  const np = document.getElementById("numpad");
  np.innerHTML = "";
  NUMPAD_LAYOUT.forEach(({ code, r, c, rs = 1, cs = 1, label }) => {
    const el = document.createElement("div");
    el.className = "key";
    el.dataset.code = code;
    el.style.gridArea = `${r} / ${c} / ${r + rs} / ${c + cs}`;
    const ch = NUMPAD_KEYS[code]?.[0];
    const text = label ?? (ch === "\n" ? "↵" : ch == null ? "" : x(String(ch)));
    el.innerHTML = `<span class="${label ? "sp" : "main"}">${text}</span>`;
    np.appendChild(el);
  });
}

// ═══════════════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════════════
document.addEventListener("keydown", e => {
  if (document.activeElement.tagName === "INPUT") return;
  if (e.code === "Tab") { e.preventDefault(); return; }

  if (e.code === "ShiftLeft" || e.code === "ShiftRight") mods.shift = true;
  if (e.code === "AltRight")  mods.altgr = true;
  if (e.code === "CapsLock")  mods.caps  = !mods.caps;

  const isNumpad = e.code in NUMPAD_KEYS;

  if (isNumpad && !numpadDetected) {
    numpadDetected = true;
    numpadVisible  = true;
    document.getElementById("numpad").hidden = false;
  }

  if (layout.keys[e.code] || isNumpad || e.code === "Backspace" || e.code === "Delete"
      || e.code === "ArrowLeft" || e.code === "ArrowRight") e.preventDefault();

  if (held.has(e.code)) return;
  held.add(e.code);
  setActive(e.code, true);

  if (mode !== "free") { handleExKey(e, isNumpad); return; }

  if (e.code === "ArrowLeft" || e.code === "ArrowRight") {
    const dir = e.code === "ArrowLeft" ? -1 : 1;
    if (e.shiftKey) {
      if (selAnchor === null) selAnchor = cursorPos;
      cursorPos = Math.max(0, Math.min(typed.length, cursorPos + dir));
    } else {
      if (selAnchor !== null) {
        const b = getSelBounds();
        cursorPos = dir < 0 ? b.start : b.end;
        selAnchor = null;
      } else {
        cursorPos = Math.max(0, Math.min(typed.length, cursorPos + dir));
      }
    }
    renderDisplay();
    return;
  }

  if (e.code === "Backspace" || e.code === "Delete") {
    if (selAnchor !== null) {
      const b = getSelBounds();
      typed.splice(b.start, b.end - b.start);
      cursorPos = b.start;
      selAnchor = null;
    } else if (e.code === "Backspace") {
      if (cursorPos > 0) { typed.splice(cursorPos - 1, 1); cursorPos--; }
    } else {
      if (cursorPos < typed.length) typed.splice(cursorPos, 1);
    }
    renderDisplay();
    renderStats();
    return;
  }

  const lyr = isNumpad ? NUMPAD_KEYS[e.code] : layout.keys[e.code];
  if (!lyr) return;

  let ch = isNumpad ? (lyr[0] ?? null) :
           mods.altgr ? (lyr[2] ?? lyr[0]) :
           mods.shift  ? (lyr[1] ?? lyr[0]) :
                          lyr[0];

  if (!isNumpad && mods.caps && !mods.shift) {
    if (ch >= "a" && ch <= "z") ch = ch.toUpperCase();
    else if (ch >= "A" && ch <= "Z") ch = ch.toLowerCase();
  }

  if (!ch) return;

  const chars = composeChar(ch);
  if (!chars.length) return;

  if (!startTime) {
    startTime = Date.now();
    timerID = setInterval(renderStats, 1000);
  }

  if (selAnchor !== null) {
    const b = getSelBounds();
    typed.splice(b.start, b.end - b.start);
    cursorPos = b.start;
    selAnchor = null;
  }

  for (const c of chars) { typed.splice(cursorPos, 0, c); cursorPos++; speak(c); }
  renderDisplay();
  renderStats();
});

document.addEventListener("keyup", e => {
  held.delete(e.code);
  if (e.code === "ShiftLeft" || e.code === "ShiftRight") mods.shift = false;
  if (e.code === "AltRight") mods.altgr = false;
  setActive(e.code, false);
  if (layout.keys[e.code] || e.code in NUMPAD_KEYS || e.code === "Backspace" || e.code === "Delete") e.preventDefault();
});

document.getElementById("display").addEventListener("click", e => {
  if (mode !== "free") return;
  const target = e.target.closest("[data-index]");
  if (target) {
    const idx  = parseInt(target.dataset.index);
    const rect = target.getBoundingClientRect();
    cursorPos  = e.clientX > rect.left + rect.width / 2 ? idx + 1 : idx;
  } else {
    cursorPos = typed.length;
  }
  selAnchor = null;
  renderDisplay();
});

document.getElementById("display").addEventListener("mouseup", e => {
  if (mode !== "free") return;
  const nativeSel = window.getSelection();
  if (!nativeSel || nativeSel.isCollapsed || !nativeSel.rangeCount) return;
  const range = nativeSel.getRangeAt(0);

  function nodeToIndex(node, offset) {
    const el = (node.nodeType === Node.TEXT_NODE ? node.parentElement : node)
                 ?.closest("[data-index]");
    return el ? parseInt(el.dataset.index) + (offset > 0 ? 1 : 0) : null;
  }

  const a = nodeToIndex(range.startContainer, range.startOffset);
  const b = nodeToIndex(range.endContainer,   range.endOffset);
  if (a !== null && b !== null && a !== b) {
    selAnchor = a;
    cursorPos = b;
    nativeSel.removeAllRanges();
    renderDisplay();
  }
});

// ═══════════════════════════════════════════════════════════
//  DISPLAY & STATS
// ═══════════════════════════════════════════════════════════
function renderDisplay() {
  const el  = document.getElementById("display");
  const sel = getSelBounds();
  let html  = "";
  for (let i = 0; i <= typed.length; i++) {
    if (i === cursorPos) html += '<span class="cursor"></span>';
    if (i < typed.length) {
      const c = typed[i];
      const inSel = sel && i >= sel.start && i < sel.end;
      const cls   = inSel ? ' class="sel"' : '';
      html += c === "\n"
        ? `<span data-index="${i}"${cls}><br></span>`
        : `<span data-index="${i}"${cls}>${c === " " ? "&nbsp;" : x(c)}</span>`;
    }
  }
  el.innerHTML = html;
}

function renderStats() {
  const elapsed = startTime ? (Date.now() - startTime) / 60000 : 0;
  const wpm = elapsed > 0.005 ? Math.round((typed.length / 5) / elapsed) : 0;
  const sec = elapsed > 0 ? Math.round(elapsed * 60) : 0;
  const dur = sec >= 60 ? `${Math.floor(sec/60)}m${sec%60}s` : `${sec}s`;
  document.getElementById("wpm").textContent      = wpm;
  document.getElementById("keyCount").textContent = typed.length;
  document.getElementById("duration").textContent  = startTime ? dur : "0s";
}

// ═══════════════════════════════════════════════════════════
//  EXERCISE
// ═══════════════════════════════════════════════════════════
function pickSentence() {
  const list = SENTENCE_PACKS[sentPackKey]?.sentences ?? [];
  return list[Math.floor(Math.random() * list.length)] ?? "";
}

// Returns { name, data } where data is the sentence-keyed map for the current player only.
// Storage format: kbm_personal_<mode> = { "<playerName>": { "<sentence>": {...} } }
function getMyPersonal(hofMode) {
  const name = localStorage.getItem("kbm_player") || "";
  if (!name) return { name: "", data: {} };
  let all = {};
  try { all = JSON.parse(localStorage.getItem(`kbm_personal_${hofMode}`) || '{}'); } catch {}
  if (typeof all !== 'object' || Array.isArray(all)) all = {};
  const d = all[name];
  return { name, data: (d && typeof d === 'object' && !Array.isArray(d)) ? d : {} };
}

function updateThemeSel() {
  const modeFilter = mode === "accountant" ? "accountant" : "sentence";
  const hofMode    = modeFilter;
  const { data: personal } = getMyPersonal(hofMode);

  const sel = document.getElementById("themeSel");
  sel.innerHTML = "";
  Object.entries(SENTENCE_PACKS)
    .filter(([, p]) => p.mode === modeFilter)
    .forEach(([key, pack]) => {
      const o = document.createElement("option");
      o.value = key;
      const sentences  = pack.sentences ?? [];
      const tries      = sentences.reduce((s, sent) => s + (personal[sent]?.wpms?.length ?? 0), 0);
      const triesPart  = tries > 0 ? ` · ${tries} tries` : '';
      o.textContent = (pack.flag ? pack.flag + "  " : "") + pack.label
                    + ` (${sentences.length} sentences${triesPart})`;
      o.selected = (key === sentPackKey);
      sel.appendChild(o);
    });
  document.getElementById("themeBar").hidden = (mode === "free");
}

function renderExSentenceStats() {
  const el = document.getElementById("exSentenceStats");
  const hofMode = mode === "accountant" ? "accountant" : "sentence";
  const { data: personal } = getMyPersonal(hofMode);
  const s = personal[exSentence];
  if (!s || !s.wpms || !s.wpms.length) { el.hidden = true; return; }
  const mean_wpm = Math.round(s.wpms.reduce((a, b) => a + b, 0) / s.wpms.length);
  el.hidden = false;
  el.innerHTML = `
    <span class="ex-stat"><span class="ex-stat-val">${s.wpms.length}</span><span class="ex-stat-lbl">tries</span></span>
    <span class="ex-stat"><span class="ex-stat-val">${s.best_wpm}</span><span class="ex-stat-lbl">best WPM</span></span>
    <span class="ex-stat"><span class="ex-stat-val">${mean_wpm}</span><span class="ex-stat-lbl">mean WPM</span></span>
  `;
}

function startExercise() {
  exSentence   = pickSentence();
  exTyped      = [];
  exBackspaces = 0;
  exStartTime  = null;
  exCompleted  = false;
  clearInterval(exTimerID);
  document.getElementById("display").innerHTML = '<span class="cursor"></span>';
  autoSkipSpaces();
  renderExercise();
  renderExStats();
  renderExSentenceStats();
  if (exSentMode === "hear" || exSentMode === "both") speakSentence(exSentence);
}

function renderExercise() {
  const el = document.getElementById("exerciseTarget");
  if (exSentMode === "hear") {
    el.innerHTML = `<span class="ch-todo">${exTyped.length}/${exSentence.length} — typed from memory</span>`;
    return;
  }

  let typedHtml = "";
  let hasErrors = false;

  for (let i = 0; i < exSentence.length; i++) {
    const target = exSentence[i];
    const tgt    = target === " " ? "&nbsp;" : x(target);

    if (i < exTyped.length) {
      if (exTyped[i] === target) {
        typedHtml += `<span class="ch-ok">${tgt}</span>`;
      } else {
        hasErrors = true;
        const typed = exTyped[i] === " " ? "␣" : x(exTyped[i]);
        typedHtml += `<span class="ch-err">${typed}</span>`;
      }
    } else if (i === exTyped.length) {
      typedHtml += `<span class="ch-cur">${tgt}</span>`;
    } else {
      typedHtml += `<span class="ch-todo">${tgt}</span>`;
    }
  }

  let refHtml = "";
  if (hasErrors) {
    refHtml = '<div class="ex-reference">';
    for (let i = 0; i < exSentence.length; i++) {
      const target = exSentence[i];
      const tgt    = target === " " ? "&nbsp;" : x(target);
      const isErr  = i < exTyped.length && exTyped[i] !== target;
      refHtml += `<span class="${isErr ? "ch-ref-err" : "ch-ref"}">${tgt}</span>`;
    }
    refHtml += '</div>';
  }

  el.innerHTML = typedHtml + refHtml;
}

function renderExStats() {
  const elapsed = exStartTime ? (Date.now() - exStartTime) / 60000 : 0;
  const correct = exTyped.filter((c, i) => c === exSentence[i]).length;
  const wpm = elapsed > 0.005 ? Math.round((correct / 5) / elapsed) : 0;
  const sec = elapsed > 0 ? Math.round(elapsed * 60) : 0;
  const dur = sec >= 60 ? `${Math.floor(sec/60)}m${sec%60}s` : `${sec}s`;
  document.getElementById("wpm").textContent      = wpm;
  document.getElementById("keyCount").textContent = exTyped.length;
  document.getElementById("duration").textContent  = exStartTime ? dur : "0s";
  document.getElementById("errCount").textContent  = exBackspaces;
}

function resolveChar(e, isNumpad) {
  const lyr = isNumpad ? NUMPAD_KEYS[e.code] : layout.keys[e.code];
  if (!lyr) return null;
  let ch = isNumpad ? (lyr[0] ?? null) :
           mods.altgr ? (lyr[2] ?? lyr[0]) :
           mods.shift  ? (lyr[1] ?? lyr[0]) :
                          lyr[0];
  if (!isNumpad && mods.caps && !mods.shift) {
    if (ch >= "a" && ch <= "z") ch = ch.toUpperCase();
    else if (ch >= "A" && ch <= "Z") ch = ch.toLowerCase();
  }
  return ch || null;
}

function autoSkipSpaces() {
  while (mode === "accountant"
      && exTyped.length < exSentence.length
      && exSentence[exTyped.length] === " ") {
    exTyped.push(" ");
  }
}

function handleExKey(e, isNumpad) {
  if (exCompleted) return;

  if (e.code === "Backspace" || e.code === "Delete") {
    if (exTyped.length > 0) {
      exTyped.pop();
      exBackspaces++;
      while (mode === "accountant" && exTyped.length > 0
          && exSentence[exTyped.length - 1] === " ") {
        exTyped.pop();
      }
    }
    renderExercise();
    renderExStats();
    return;
  }

  const raw = resolveChar(e, isNumpad);
  if (!raw) return;

  if (mode === "accountant" && raw === " ") return;
  if (exTyped.length >= exSentence.length) return;  // sentence full — must fix errors first

  const chars = composeChar(raw);
  if (!chars.length) return;

  if (!exStartTime) {
    exStartTime = Date.now();
    exTimerID   = setInterval(renderExStats, 1000);
  }

  for (const ch of chars) {
    autoSkipSpaces();
    if (exTyped.length >= exSentence.length) break;
    exTyped.push(ch);
    speak(ch);
  }
  autoSkipSpaces();
  renderExercise();
  renderExStats();

  if (exTyped.length >= exSentence.length) {
    const allCorrect = [...exSentence].every((c, i) =>
      (mode === "accountant" && c === " ") || exTyped[i] === c
    );
    if (allCorrect) {
      clearInterval(exTimerID);
      exCompleted = true;
      setTimeout(showCompletion, 350);
    }
  }
}

function getExResults() {
  const elapsed = exStartTime ? (Date.now() - exStartTime) / 60000 : 0;
  const indices = [...exSentence].map((c, i) => i)
    .filter(i => mode !== "accountant" || exSentence[i] !== " ");
  const remaining = indices.filter(i => (exTyped[i] ?? "") !== exSentence[i]).length;
  const scored    = indices.length;
  const correct   = scored - remaining;
  const wpm       = elapsed > 0.005 ? Math.round((correct / 5) / elapsed) : 0;
  const accuracy  = scored > 0
    ? Math.round((correct / (scored + exBackspaces)) * 100)
    : 0;
  const sec = elapsed > 0 ? Math.round(elapsed * 60) : 0;
  const dur = sec >= 60 ? `${Math.floor(sec/60)}m${sec%60}s` : `${sec}s`;
  return { wpm, accuracy, remaining, corrected: exBackspaces, dur };
}

function showCompletion() {
  exLastResults = getExResults();
  const r = exLastResults;
  document.getElementById("modalStats").innerHTML = `
    <div class="stat"><div class="val">${r.wpm}</div><div class="lbl">WPM</div></div>
    <div class="stat"><div class="val">${r.accuracy}%</div><div class="lbl">Accuracy</div></div>
    <div class="stat"><div class="val">${r.remaining}</div><div class="lbl">Remaining</div></div>
    <div class="stat"><div class="val">${r.corrected}</div><div class="lbl">Corrections</div></div>
    <div class="stat"><div class="val">${r.dur}</div><div class="lbl">Time</div></div>
  `;
  const saved = localStorage.getItem("kbm_player") || "";
  document.getElementById("playerName").value = saved;
  document.getElementById("modalOverlay").hidden = false;
  setTimeout(() => document.getElementById("playerName").focus(), 50);
}

// ═══════════════════════════════════════════════════════════
//  HALL OF FAME
// ═══════════════════════════════════════════════════════════
async function hofFetch(m) {
  try {
    const r = await fetch(`hof.php?mode=${m}`);
    return r.ok ? r.json() : [];
  } catch { return []; }
}

async function hofPost(entry, m) {
  try {
    const r = await fetch('hof.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: m, entry }),
    });
    if (!r.ok) return [];
    const j = await r.json();
    return j.entries ?? [];
  } catch { return []; }
}

let _countryCache = null;
async function getCountryCode() {
  if (_countryCache !== null) return _countryCache;
  try {
    const ctrl  = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 4000);
    const r     = await fetch('https://ipapi.co/country/', { signal: ctrl.signal });
    clearTimeout(timer);
    const code  = (await r.text()).trim().toUpperCase();
    _countryCache = /^[A-Z]{2}$/.test(code) ? code : '';
  } catch {
    _countryCache = '';
  }
  return _countryCache;
}

function renderHof(m, entries) {
  const s        = m === "accountant" ? "Account" : "Sentence";
  const panel    = document.getElementById(`hofPanel${s}`);
  const medals   = ["🥇","🥈","🥉"];
  const trunc    = (str, n) => str.length > n ? x(str.slice(0, n)) + '…' : x(str);

  // ── My Records (localStorage, current player only) ───────────────────────────
  const { name: playerName, data: personal } = getMyPersonal(m);
  const mySubEl  = document.getElementById(`hofMyRecords${s}`);
  const myTable  = document.getElementById(`hofTableMy${s}`);

  const myRows = playerName ? Object.values(personal)
    .filter(e => e.wpms && e.wpms.length > 0)
    .map(e => ({ ...e,
      mean_wpm: Math.round(e.wpms.reduce((a, b) => a + b, 0) / e.wpms.length),
      count: e.wpms.length,
    }))
    .sort((a, b) => b.best_wpm - a.best_wpm) : [];

  if (myRows.length) {
    document.getElementById(`hofMyName${s}`).textContent = playerName;
    myTable.innerHTML = `
      <tr>
        <th>#</th><th>Sentence</th>
        <th title="Best WPM — no remaining errors">Best</th>
        <th title="Mean WPM — no remaining errors">Mean</th>
        <th>Tries</th><th>Last date</th>
      </tr>
      ${myRows.slice(0, 10).map((e, i) => `
        <tr class="hof-personal">
          <td class="rank">${medals[i] ?? i + 1}</td>
          <td class="hof-sentence" title="${x(e.sentence)}">${trunc(e.sentence, 48)}</td>
          <td class="wpm">${e.best_wpm}</td>
          <td>${e.mean_wpm}</td>
          <td class="muted">${e.count}</td>
          <td class="muted">${e.best_date}</td>
        </tr>`).join("")}
    `;
    mySubEl.hidden = false;
  } else {
    mySubEl.hidden = true;
  }

  // ── All-time global (server): top-3 per sentence ─────────────────────────────
  const globalSubEl = document.getElementById(`hofGlobal${s}`);
  const globalTable = document.getElementById(`hofTableGlobal${s}`);

  if (entries.length) {
    globalTable.innerHTML = `
      <tr>
        <th>#</th><th></th><th>Name</th>
        <th title="WPM — no remaining errors">WPM</th>
        <th title="Backspaces used">Corr.</th><th>Date</th>
      </tr>
      ${entries.map(e => `
        <tr class="hof-sent-header">
          <td colspan="6" title="${x(e.sentence)}">
            ${trunc(e.sentence, 65)}<span class="hof-pack">${x(e.pack ?? "")}</span>
          </td>
        </tr>
        ${e.runs.map((r, i) => `
          <tr class="hof-rank-${i + 1}">
            <td class="rank">${medals[i]}</td>
            <td class="hof-flag">${r.flag ?? ""}</td>
            <td class="name">${x(r.name)}</td>
            <td class="wpm">${r.wpm}</td>
            <td class="muted">${r.corrected ?? 0}</td>
            <td class="muted">${r.date}</td>
          </tr>`).join("")}
      `).join("")}
    `;
    globalSubEl.hidden = false;
  } else {
    globalSubEl.hidden = true;
  }

  panel.hidden = (mode !== m) || (!myRows.length && !entries.length);
}

async function refreshHof(m) {
  renderHof(m, await hofFetch(m));
}

// ═══════════════════════════════════════════════════════════
//  CONTROLS
// ═══════════════════════════════════════════════════════════
const layoutSel = document.getElementById("layoutSel");
Object.entries(LAYOUTS).forEach(([id, l]) => {
  const o = document.createElement("option");
  o.value = id; o.textContent = l.name;
  o.selected = (id === CONFIG.defaultLayout);
  layoutSel.appendChild(o);
});
layoutSel.addEventListener("change", e => {
  layout = LAYOUTS[e.target.value];
  renderKeyboard();
  loadVoices();
  reset();
});

document.getElementById("btnAudio").addEventListener("click", function () {
  audioOn = !audioOn;
  this.textContent = audioOn ? "🔊 Audio" : "🔇 Audio";
  this.classList.toggle("on", audioOn);
  this.blur();
});

document.getElementById("btnAudioMode").addEventListener("click", function () {
  audioMode = audioMode === "key" ? "word" : "key";
  this.textContent = audioMode === "key" ? "Per key" : "Per word";
  this.classList.toggle("on", audioMode === "word");
  this.blur();
});

document.getElementById("btnBlind").addEventListener("click", function () {
  blindMode = !blindMode;
  document.getElementById("kbWrap").classList.toggle("blind", blindMode);
  this.textContent = blindMode ? "🙈 Blind mode" : "👁 Show keyboard";
  this.classList.toggle("on", blindMode);
  this.blur();
});

document.getElementById("btnClear").addEventListener("click", function () { reset(); this.blur(); });

function activateMode(newMode) {
  if (mode === newMode) return;
  mode = newMode;
  const isEx = mode !== "free";

  if (mode === "accountant") sentPackKey = "numpad";
  else if (mode === "sentence" && sentPackKey === "numpad") {
    sentPackKey = CONFIG.preferLang === "fr" ? "fr" : "en";
  }

  document.getElementById("btnModeFree").classList.toggle("on",     mode === "free");
  document.getElementById("btnModeSentence").classList.toggle("on", mode === "sentence");
  document.getElementById("btnModeAccount").classList.toggle("on",  mode === "accountant");
  document.getElementById("exercisePanel").hidden = !isEx;
  document.getElementById("statErrors").hidden    = !isEx;
  document.getElementById("display").hidden       = isEx;
  updateThemeSel();

  // Hide both HoF panels; renderHof will re-show the relevant one if content exists
  document.getElementById("hofPanelSentence").hidden = true;
  document.getElementById("hofPanelAccount").hidden  = true;

  if (isEx) {
    if (mode === "accountant") {
      numpadVisible = true;
      document.getElementById("numpad").hidden = false;
    }
    startExercise();
    refreshHof(mode === "accountant" ? "accountant" : "sentence");
  } else {
    clearInterval(exTimerID);
    reset();
  }
}

document.getElementById("btnModeFree").addEventListener("click", function () {
  activateMode("free"); this.blur();
});
document.getElementById("btnModeSentence").addEventListener("click", function () {
  activateMode("sentence"); this.blur();
});
document.getElementById("btnModeAccount").addEventListener("click", function () {
  activateMode("accountant"); this.blur();
});

document.getElementById("themeSel").addEventListener("change", e => {
  sentPackKey = e.target.value;
  if (mode !== "free") startExercise();
});

["btnExSee","btnExHear","btnExBoth"].forEach(id => {
  document.getElementById(id).addEventListener("click", function () {
    exSentMode = { btnExSee:"see", btnExHear:"hear", btnExBoth:"both" }[id];
    document.getElementById("btnExSee").classList.toggle("on",  exSentMode === "see");
    document.getElementById("btnExHear").classList.toggle("on", exSentMode === "hear");
    document.getElementById("btnExBoth").classList.toggle("on", exSentMode === "both");
    startExercise();
    this.blur();
  });
});

document.getElementById("btnNewSentence").addEventListener("click", function () {
  startExercise(); this.blur();
});

document.getElementById("btnRepeat").addEventListener("click", function () {
  speakSentence(exSentence); this.blur();
});

document.getElementById("playerName").addEventListener("keydown", e => {
  if (e.key === "Enter") saveAndNext();
  if (e.key === "Escape") {
    document.getElementById("modalOverlay").hidden = true;
    startExercise();
  }
});

document.getElementById("btnNextEx").addEventListener("click", function () {
  saveAndNext(); this.blur();
});

function setPlayerBadge(name) {
  const el = document.getElementById("playerBadge");
  if (name && name !== "Anonymous") {
    el.textContent = name;
    el.hidden = false;
    localStorage.setItem("kbm_player", name);
  }
}

let _saveGuard = false;
async function saveAndNext() {
  if (_saveGuard) return;
  _saveGuard = true;

  const name    = document.getElementById("playerName").value.trim() || "Anonymous";
  setPlayerBadge(name);
  const r       = exLastResults;
  const now     = new Date();
  const pad     = n => String(n).padStart(2, '0');
  const date    = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const hofMode = mode === "accountant" ? "accountant" : "sentence";
  const pack    = SENTENCE_PACKS[sentPackKey];
  const packTag = pack ? `${pack.code ?? sentPackKey} v${pack.version ?? 1}` : sentPackKey;
  const country           = _countryCache ?? '';
  const sentenceCompleted = exSentence;  // capture before startExercise() resets it

  if (r.remaining === 0) {
    const personalKey = `kbm_personal_${hofMode}`;
    let all = {};
    try { all = JSON.parse(localStorage.getItem(personalKey) || '{}'); } catch {}
    if (typeof all !== 'object' || Array.isArray(all)) all = {};
    if (!all[name] || typeof all[name] !== 'object') all[name] = {};
    const mine = all[name];
    if (!mine[sentenceCompleted]) mine[sentenceCompleted] = { sentence: sentenceCompleted, pack: packTag, wpms: [], best_wpm: 0, best_date: '' };
    mine[sentenceCompleted].wpms.push(r.wpm);
    if (r.wpm > mine[sentenceCompleted].best_wpm) {
      mine[sentenceCompleted].best_wpm = r.wpm;
      mine[sentenceCompleted].best_date = date;
    }
    localStorage.setItem(personalKey, JSON.stringify(all));
  }

  document.getElementById("modalOverlay").hidden = true;
  startExercise();
  updateThemeSel();
  _saveGuard = false;

  logEvent('exercise_complete', {
    wpm: r.wpm, accuracy: r.accuracy, remaining: r.remaining,
    corrected: r.corrected, dur: r.dur, sentmode: exSentMode, pack: packTag, country,
  });
  const entries = await hofPost(
    { name, wpm: r.wpm, accuracy: r.accuracy,
      remaining: r.remaining, corrected: r.corrected, date, pack: packTag, country,
      sentence: sentenceCompleted },
    hofMode
  );
  renderHof(hofMode, entries.length ? entries : await hofFetch(hofMode));
}

function reset() {
  typed = []; cursorPos = 0; selAnchor = null; startTime = null;
  clearInterval(timerID);
  renderDisplay();
  renderStats();
}

// ═══════════════════════════════════════════════════════════
//  LOGGING
// ═══════════════════════════════════════════════════════════
function logEvent(event, extra = {}) {
  fetch('log.php', {
    method:    'POST',
    headers:   { 'Content-Type': 'application/json' },
    body:      JSON.stringify({ event, layout: layout.region, ...extra }),
    keepalive: true,
  }).catch(() => {});
}

//  INIT
// ═══════════════════════════════════════════════════════════
document.getElementById("badge").textContent        = CONFIG.instance;
document.getElementById("versionBadge").textContent = CONFIG.version;
document.title = `Keyboard Master — ${CONFIG.instance}`;
setPlayerBadge(localStorage.getItem("kbm_player") || "");
document.getElementById("btnAudioMode").classList.add("on");
document.getElementById("numpad").hidden = true;
numpadVisible  = false;
numpadDetected = false;
renderKeyboard();
renderNumpad();
renderDisplay();
activateMode("sentence");
getCountryCode();  // pre-fetch in background; result cached for HoF submission
logEvent('visit');
</script>

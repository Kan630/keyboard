<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyboard Master — Keyboard Trainer</title>
  <link rel="icon" type="image/png" sizes="32x32" href="img/driot_keyboard_favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --bg:              #0d1117;
      --surface:         #161b22;
      --surface2:        #21262d;
      --border:          #30363d;
      --accent:          #58a6ff;
      --text:            #e6edf3;
      --text-muted:      #8b949e;
      --key-bg:          #21262d;
      --key-border:      #30363d;
      --key-shadow:      #010409;
      --key-active-bg:   #58a6ff;
      --key-active-bdr:  #79c0ff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 18px;
    }

    header { text-align: center; }
    h1 { font-size: 1.8rem; font-weight: 700; color: var(--accent); letter-spacing: -0.03em;
         display: flex; align-items: center; justify-content: center; gap: 10px; }
    h1 img { height: 36px; width: auto; border-radius: 8px; }
    .tagline { color: var(--text-muted); font-size: 0.82rem; margin-top: 3px; }

    /* ── Controls ── */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .ctrl-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }

    .ctrl-group { display: flex; align-items: center; gap: 6px; }
    label { font-size: 0.78rem; color: var(--text-muted); }

    select {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
    }
    select:focus { border-color: var(--accent); }

    button {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background .12s, border-color .12s;
    }
    button:hover  { border-color: var(--accent); }
    button.on     { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }

    /* ── Keyboard ── */
    .kb-wrap { transition: filter .3s; }
    .kb-wrap.blind { filter: blur(28px) brightness(0.15); pointer-events: none; }
    .kb-main-row { display: flex; gap: 12px; align-items: flex-start; }

    .keyboard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      box-shadow: 0 8px 28px rgba(0,0,0,.65);
    }

    /* Numpad overrides keyboard flex with a real grid */
    #numpad {
      display: grid !important;
      grid-template-columns: repeat(4, 42px);
      grid-template-rows: repeat(5, 44px);
    }
    #numpad .key { height: auto; align-self: stretch; justify-content: center; }

    .kb-row { display: flex; gap: 5px; justify-content: center; }

    .key {
      position: relative;
      background: var(--key-bg);
      border: 1px solid var(--key-border);
      border-bottom: 3px solid var(--key-shadow);
      border-radius: 6px;
      min-width: 42px;
      height: 44px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
      padding: 3px 5px;
      color: var(--text);
      transition: background .06s, transform .06s, border-bottom-width .06s;
      user-select: none;
    }

    .key.active {
      background: var(--key-active-bg);
      border-color: var(--key-active-bdr);
      border-bottom-width: 1px;
      transform: translateY(2px);
      color: #0d1117;
    }

    .key .main  { font-size: 0.82rem; font-weight: 500; line-height: 1; }
    .key .shft  { position: absolute; top: 3px; left: 5px; font-size: 0.58rem; color: var(--text-muted); line-height: 1; }
    .key .agr   { position: absolute; top: 3px; right: 5px; font-size: 0.58rem; color: #79c0ff; line-height: 1; }
    .key .sp    { font-size: 0.7rem; color: var(--text-muted); }
    .key.active .shft,
    .key.active .agr,
    .key.active .sp  { color: rgba(0,0,0,.55); }

    /* width helpers */
    .w15 { min-width:  63px; }
    .w2  { min-width:  89px; }
    .w25 { min-width: 110px; }
    .w65 { min-width: 262px; }

    /* Enter key spans 2 rows */
    .key[data-code="Enter"] {
      height: 93px;
      margin-top: calc(-44px - 5px);
      position: relative;
      z-index: 1;
    }

    /* ── Practice area ── */
    .practice {
      width: 100%;
      max-width: 740px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .display {
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 1.3rem;
      min-height: 52px;
      word-break: break-all;
      line-height: 1.7;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background: var(--accent);
      vertical-align: text-bottom;
      border-radius: 1px;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

    .stats { display: flex; gap: 32px; justify-content: center; }
    .stat  { text-align: center; }
    .stat .val { font-size: 1.6rem; font-weight: 700; color: var(--accent); line-height: 1; }
    .stat .lbl { font-size: 0.68rem; color: var(--text-muted); margin-top: 2px; }

    .practice-footer { display: flex; justify-content: flex-end; }

    /* ── Mode bar ── */
    .mode-bar {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .mode-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 14px 32px;
      min-width: 155px;
      border-radius: 12px;
      transition: background .12s, border-color .12s, transform .1s;
    }
    .mode-card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .mode-card.on    { background: var(--accent); color: #0d1117; border-color: var(--accent); }

    .mode-icon { font-size: 1.6rem; line-height: 1; }
    .mode-name { font-size: 0.88rem; font-weight: 700; }
    .mode-desc { font-size: 0.68rem; color: var(--text-muted); }
    .mode-card.on .mode-desc { color: rgba(0,0,0,.55); }

    /* ── Exercise mode ── */
    .exercise-panel {
      width: 100%;
      max-width: 740px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ex-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .ex-sent-btns { display: flex; gap: 4px; }

    .exercise-target {
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 1.25rem;
      line-height: 1.8;
      min-height: 52px;
      word-break: break-word;
    }

    .ch-ok   { color: #3fb950; }
    .ch-err  { color: #f85149; }
    .ch-cur  { background: var(--accent); color: #0d1117; border-radius: 2px; padding: 0 1px; }
    .ch-todo { color: var(--text-muted); }

    .ex-reference {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 0.95em;
      opacity: 0.75;
    }
    .ch-ref     { color: var(--text-muted); }
    .ch-ref-err { color: #f85149; font-weight: 700; }

    /* ── Completion modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 340px;
      box-shadow: 0 16px 48px rgba(0,0,0,.8);
    }

    .modal h2 { color: var(--accent); font-size: 1.4rem; text-align: center; }
    .modal-stats { display: flex; gap: 20px; justify-content: center; }

    .modal input[type="text"] {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.9rem;
      outline: none;
      width: 100%;
    }
    .modal input[type="text"]:focus { border-color: var(--accent); }

    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* ── Hall of Fame ── */
    .hof-panel {
      width: 100%;
      max-width: 740px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .hof-panel h2 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 12px;
      letter-spacing: .05em;
    }

    .hof-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .hof-table th {
      color: var(--text-muted);
      text-align: left;
      padding: 4px 10px;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
    }
    .hof-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); }
    .hof-table tr:last-child td { border-bottom: none; }
    .hof-table .rank { color: var(--text-muted); font-size: 1rem; }
    .hof-table .name { font-weight: 600; }
    .hof-table .wpm  { color: var(--accent); font-weight: 700; font-size: 1rem; }
    .hof-rank-1 td   { background: rgba(255,215,0,.06); }
    .hof-rank-2 td   { background: rgba(192,192,192,.04); }
    .hof-rank-3 td   { background: rgba(205,127,50,.04); }

    /* ── Badges ── */
    .badge {
      position: fixed;
      font-size: 0.66rem;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
    }
    #badge        { bottom: 10px; right: 14px; }
    #versionBadge { top: 10px; right: 14px; }
    #playerBadge  { top: 34px; right: 14px; font-size: 0.72rem; color: var(--accent); }
    /* ── Theme bar ── */
    .theme-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }
    .theme-bar label { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; }
  </style>
</head>
<body>

<header>
  <h1><img src="img/driot_keyboard_icon.png" alt="">Keyboard Master</h1>
  <p class="tagline">Learn to type without looking — audio guided</p>
</header>

<div class="mode-bar">
  <button class="mode-card" id="btnModeSentence">
    <span class="mode-icon">📝</span>
    <span class="mode-name">Writer</span>
    <span class="mode-desc">Type displayed text</span>
  </button>
  <button class="mode-card" id="btnModeAccount">
    <span class="mode-icon">🔢</span>
    <span class="mode-name">Accountant</span>
    <span class="mode-desc">Numpad figures &amp; operators</span>
  </button>
</div>

<div class="theme-bar" id="themeBar" hidden>
  <label for="themeSel">Theme</label>
  <select id="themeSel"></select>
</div>

<div class="controls">
  <div class="ctrl-row">
    <div class="ctrl-group">
      <label for="layoutSel">Layout</label>
      <select id="layoutSel"></select>
    </div>
    <button id="btnBlind">👁 Show keyboard</button>
  </div>
  <div class="ctrl-row">
    <div class="ctrl-group">
      <label for="voiceSel">Voice</label>
      <select id="voiceSel"></select>
    </div>
    <button id="btnAudio">🔇 Audio</button>
    <button id="btnAudioMode">Per key</button>
  </div>
</div>

<div class="kb-wrap" id="kbWrap">
  <div class="kb-main-row">
    <div class="keyboard" id="keyboard"></div>
    <div class="keyboard" id="numpad" hidden></div>
  </div>
</div>

<div class="exercise-panel" id="exercisePanel" hidden>
  <div class="ex-controls">
    <div class="ex-sent-btns">
      <button id="btnExSee" class="on">See</button>
      <button id="btnExHear">Hear</button>
      <button id="btnExBoth">Both</button>
      <button id="btnRepeat" title="Repeat sentence">↺ Repeat</button>
    </div>
    <button id="btnNewSentence">↺ New sentence</button>
  </div>
  <div class="exercise-target" id="exerciseTarget"></div>
</div>

<div class="practice">
  <div class="display" id="display"><span class="cursor"></span></div>
  <div class="stats">
    <div class="stat"><div class="val" id="wpm">0</div><div class="lbl">WPM</div></div>
    <div class="stat"><div class="val" id="keyCount">0</div><div class="lbl">Keys</div></div>
    <div class="stat"><div class="val" id="duration">0s</div><div class="lbl">Time</div></div>
    <div class="stat" id="statErrors" hidden><div class="val" id="errCount">0</div><div class="lbl">Corrections</div></div>
  </div>
  <div class="practice-footer">
    <button id="btnClear">Clear</button>
  </div>
</div>

<div class="hof-panel" id="hofPanelSentence" hidden>
  <h2>📝 Sentence — Hall of Fame</h2>
  <table class="hof-table" id="hofTableSentence"></table>
</div>

<div class="hof-panel" id="hofPanelAccount" hidden>
  <h2>🔢 Accountant — Hall of Fame</h2>
  <table class="hof-table" id="hofTableAccount"></table>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal">
    <h2>Completed!</h2>
    <div class="modal-stats" id="modalStats"></div>
    <input type="text" id="playerName" placeholder="Your name… (Enter to confirm)" maxlength="24" autocomplete="off">
    <div class="modal-actions">
      <button id="btnNextEx">Next sentence →</button>
    </div>
  </div>
</div>

<div class="badge" id="badge"></div>
<div class="badge" id="versionBadge"></div>
<div class="badge" id="playerBadge" hidden></div>

<script src="sentences.js"></script>

  " ":"espace", "\n":"entrée", "@":"arobase", "#":"dièse", "&":"esperluette",
  "€":"euro", "$":"dollar", "£":"livre sterling", "¢":"cent",

  "§":"paragraphe", "°":"degré", "²":"carré",
  "|":"barre verticale", "\\":"antislash", "/":"slash",
  '"':"guillemet", "'":"apostrophe", "<":"inférieur à",
  ">":"supérieur à", "¬":"signe non", "¦":"barre brisée",
  "*":"astérisque", "+":"plus", "-":"tiret", "_":"underscore",
  "=":"égal", "?":"point d'interrogation", "!":"point d'exclamation",
  ",":"virgule", ".":"point", ";":"point-virgule", ":":"deux points",
  "(":"parenthèse ouvrante", ")":"parenthèse fermante",
  "[":"crochet ouvrant", "]":"crochet fermant",
  "{":"accolade ouvrante", "}":"accolade fermante",
  "ç":"cé cédille", "é":"é accent aigu", "è":"è accent grave",
  "à":"à accent grave", "ù":"u accent grave", "ü":"u tréma",
  "ö":"o tréma", "ä":"a tréma", "ê":"e accent circonflexe",
  "¢":"cent", "£":"livre", "¤":"devise",
};

const SPOKEN_EN = {
  " ":"space", "\n":"enter", "@":"at sign", "#":"hash", "&":"ampersand",
  "€":"euro", "$":"dollar", "£":"pound", "¢":"cent",
  "%":"percent", "^":"caret", "~":"tilde", "`":"backtick",
  "§":"section", "°":"degree", "|":"pipe", "\\":"backslash",
  "/":"slash", '"':"double quote", "'":"apostrophe",
  "<":"less than", ">":"greater than", "*":"asterisk",
  "+":"plus", "-":"dash", "_":"underscore", "=":"equals",
  "?":"question mark", "!":"exclamation", ",":"comma",
  ".":"period", ";":"semicolon", ":":"colon",
  "(":"open paren", ")":"close paren",
  "[":"open bracket", "]":"close bracket",
  "{":"open brace", "}":"close brace",
};

function charSpoken(ch) {
  const map = layout.lang.startsWith("fr") ? SPOKEN_FR : SPOKEN_EN;
  return map[ch] ?? ch;
}

// ═══════════════════════════════════════════════════════════
//  DEAD KEY COMPOSITION
// ═══════════════════════════════════════════════════════════
const DEAD_COMPOSE = {
  "^": { a:"â",e:"ê",i:"î",o:"ô",u:"û",A:"Â",E:"Ê",I:"Î",O:"Ô",U:"Û" },
  "¨": { a:"ä",e:"ë",i:"ï",o:"ö",u:"ü",y:"ÿ",A:"Ä",E:"Ë",I:"Ï",O:"Ö",U:"Ü",Y:"Ÿ" },
  "`": { a:"à",e:"è",i:"ì",o:"ò",u:"ù",A:"À",E:"È",I:"Ì",O:"Ò",U:"Ù" },
  "´": { a:"á",e:"é",i:"í",o:"ó",u:"ú",y:"ý",A:"Á",E:"É",I:"Í",O:"Ó",U:"Ú",Y:"Ý" },
  "~": { a:"ã",n:"ñ",o:"õ",A:"Ã",N:"Ñ",O:"Õ" },
};

let deadKey = null;

function composeChar(ch) {
  if (deadKey) {
    const composed = DEAD_COMPOSE[deadKey]?.[ch];
    const prefix   = composed ? null : deadKey;
    deadKey = null;
    return composed ? [composed] : [prefix, ch].filter(Boolean);
  }
  if (ch in DEAD_COMPOSE) { deadKey = ch; return []; }
  return [ch];
}

//  STATE
// ═══════════════════════════════════════════════════════════
let layout         = LAYOUTS[CONFIG.defaultLayout];
let audioOn        = CONFIG.audioOn;
let audioMode      = "key";     // "key" | "word"
let blindMode      = false;

let sentPackKey    = CONFIG.preferLang === "fr" ? "fr" : "en";
let exSentMode     = "see";     // "see" | "hear" | "both"
let exSentence     = "";
let exTyped        = [];
let exBackspaces   = 0;         // corrections during typing
let exStartTime    = null;
let exTimerID      = null;
let exCompleted    = false;
let exLastResults  = null;      // frozen at completion, reused for HoF save
let typed     = [];
let startTime = null;
let timerID   = null;
let voices    = [];
let voice     = null;

// ═══════════════════════════════════════════════════════════
//  SPEECH
// ═══════════════════════════════════════════════════════════
function voiceQuality(v) {
  const n = v.name.toLowerCase();
  if (/espeak|festival|mbrola/.test(n)) return 2;          // robotic — last
  if (/google|microsoft|apple|premium|neural|natural/.test(n)) return 0; // best — first
  return 1;                                                  // everything else
}

function loadVoices() {
  const raw = speechSynthesis.getVoices();
  voices = [...raw].sort((a, b) => {
    const prefA = a.lang.startsWith(CONFIG.preferLang) ? 0 : 1;
    const prefB = b.lang.startsWith(CONFIG.preferLang) ? 0 : 1;
    if (prefA !== prefB) return prefA - prefB;
    return voiceQuality(a) - voiceQuality(b);
  });
  const sel = document.getElementById("voiceSel");
  sel.innerHTML = "";
  voices.forEach((v, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = `${v.name} (${v.lang})`;
    sel.appendChild(o);
  });
  voice = voices[0] ?? null;
}

speechSynthesis.addEventListener("voiceschanged", loadVoices);
loadVoices();

document.getElementById("voiceSel").addEventListener("change", e => {
  voice = voices[+e.target.value] ?? null;
});

function speak(ch) {
  if (!audioOn || !ch) return;
  if (audioMode === "word") {
    // speak when a word boundary is typed (space, enter, punctuation)
    if (ch === " " || ch === "\n") {
      const words = typed.join("").trim().split(/[\s\n]+/);
      const last  = words[words.length - 1];
      if (!last) return;
      speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(last);
      utt.rate = CONFIG.speechRate;
      utt.lang = layout.lang;
      if (voice) utt.voice = voice;
      speechSynthesis.speak(utt);
    }
    return;
  }
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(charSpoken(ch));
  utt.rate = CONFIG.speechRate;
  utt.lang = layout.lang;
  if (voice) utt.voice = voice;
  speechSynthesis.speak(utt);
}

function speakSentence(text) {
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate  = CONFIG.speechRate * 0.85;
  utt.lang  = layout.lang;
  if (voice) utt.voice = voice;
  speechSynthesis.speak(utt);
}

// ═══════════════════════════════════════════════════════════
//  KEYBOARD RENDER
// ═══════════════════════════════════════════════════════════
function renderKeyboard() {
  const kb = document.getElementById("keyboard");
  kb.innerHTML = "";
  layout.rows.forEach(rowDef => {
    const row = document.createElement("div");
    row.className = "kb-row";
    rowDef.forEach(([code, w = "", label]) => {
      const el = document.createElement("div");
      el.className = "key" + (w ? " " + w : "");
      el.dataset.code = code;
      if (label !== undefined) {
        el.innerHTML = `<span class="sp">${label}</span>`;
      } else {
        const lyr  = layout.keys[code] ?? [];
        const def  = lyr[0] ?? "";
        const shft = lyr[1] ?? "";
        const agr  = lyr[2] ?? "";
        el.innerHTML =
          (shft ? `<span class="shft">${x(shft)}</span>` : "") +
          (agr  ? `<span class="agr">${x(agr)}</span>`   : "") +
          `<span class="main">${x(def)}</span>`;
      }
      row.appendChild(el);
    });
    kb.appendChild(row);
  });
}

function x(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function setActive(code, on) {
  document.querySelectorAll(`.key[data-code="${code}"]`).forEach(el => el.classList.toggle("active", on));
}

function renderNumpad() {
  const np = document.getElementById("numpad");
  np.innerHTML = "";
  NUMPAD_LAYOUT.forEach(({ code, r, c, rs = 1, cs = 1, label }) => {
    const el = document.createElement("div");
    el.className = "key";
    el.dataset.code = code;
    el.style.gridArea = `${r} / ${c} / ${r + rs} / ${c + cs}`;
    const ch = NUMPAD_KEYS[code]?.[0];
    const text = label ?? (ch === "\n" ? "↵" : ch == null ? "" : x(String(ch)));
    el.innerHTML = `<span class="${label ? "sp" : "main"}">${text}</span>`;
    np.appendChild(el);
  });
}

// ═══════════════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════════════
document.addEventListener("keydown", e => {
  if (document.activeElement.tagName === "INPUT") return;
  if (e.code === "Tab") { e.preventDefault(); return; }

  if (e.code === "ShiftLeft" || e.code === "ShiftRight") mods.shift = true;
  if (e.code === "AltRight")  mods.altgr = true;
  if (e.code === "CapsLock")  mods.caps  = !mods.caps;

  const isNumpad = e.code in NUMPAD_KEYS;

  // Auto-detect numpad on first numpad keypress
  if (isNumpad && !numpadDetected) {
    numpadDetected = true;
    numpadVisible  = true;
    document.getElementById("numpad").hidden = false;
  }

  if (layout.keys[e.code] || isNumpad || e.code === "Backspace") e.preventDefault();

  if (held.has(e.code)) return;
  held.add(e.code);
  setActive(e.code, true);

  if (mode !== "free") { handleExKey(e, isNumpad); return; }

  if (e.code === "Backspace") {
    typed.pop();
    renderDisplay();
    renderStats();
    return;
  }

  const lyr = isNumpad ? NUMPAD_KEYS[e.code] : layout.keys[e.code];
  if (!lyr) return;

  let ch = isNumpad ? (lyr[0] ?? null) :
           mods.altgr ? (lyr[2] ?? lyr[0]) :
           mods.shift  ? (lyr[1] ?? lyr[0]) :
                          lyr[0];

  if (!isNumpad && mods.caps && !mods.shift) {
    if (ch >= "a" && ch <= "z") ch = ch.toUpperCase();
    else if (ch >= "A" && ch <= "Z") ch = ch.toLowerCase();
  }

  if (!ch) return;

  const chars = composeChar(ch);
  if (!chars.length) return;

  if (!startTime) {
    startTime = Date.now();
    timerID = setInterval(renderStats, 1000);
  }

  for (const c of chars) { typed.push(c); speak(c); }
  renderDisplay();
  renderStats();
});

document.addEventListener("keyup", e => {
  held.delete(e.code);
  if (e.code === "ShiftLeft" || e.code === "ShiftRight") mods.shift = false;
  if (e.code === "AltRight") mods.altgr = false;
  setActive(e.code, false);
  if (layout.keys[e.code] || e.code in NUMPAD_KEYS || e.code === "Backspace") e.preventDefault();
});

// ═══════════════════════════════════════════════════════════
//  DISPLAY & STATS
// ═══════════════════════════════════════════════════════════
function renderDisplay() {
  const el  = document.getElementById("display");
  const txt = typed.map(c => c === " " ? "&nbsp;" : c === "\n" ? "<br>" : x(c)).join("");
  el.innerHTML = txt + '<span class="cursor"></span>';
}

function renderStats() {
  const elapsed = startTime ? (Date.now() - startTime) / 60000 : 0;
  const wpm = elapsed > 0.005 ? Math.round((typed.length / 5) / elapsed) : 0;
  const sec = elapsed > 0 ? Math.round(elapsed * 60) : 0;
  const dur = sec >= 60 ? `${Math.floor(sec/60)}m${sec%60}s` : `${sec}s`;
  document.getElementById("wpm").textContent      = wpm;
  document.getElementById("keyCount").textContent = typed.length;
  document.getElementById("duration").textContent  = startTime ? dur : "0s";
}

// ═══════════════════════════════════════════════════════════
//  EXERCISE
// ═══════════════════════════════════════════════════════════
function pickSentence() {
  const list = SENTENCE_PACKS[sentPackKey]?.sentences ?? [];
  return list[Math.floor(Math.random() * list.length)] ?? "";
}

function updateThemeSel() {
  const modeFilter = mode === "accountant" ? "accountant" : "sentence";
  const sel = document.getElementById("themeSel");
  sel.innerHTML = "";
  Object.entries(SENTENCE_PACKS)
    .filter(([, p]) => p.mode === modeFilter)
    .forEach(([key, pack]) => {
      const o = document.createElement("option");
      o.value = key;
      o.textContent = pack.label;
      o.selected = (key === sentPackKey);
      sel.appendChild(o);
    });
  document.getElementById("themeBar").hidden = (mode === "free");
}

function startExercise() {
  exSentence   = pickSentence();
  exTyped      = [];
  exBackspaces = 0;
  exStartTime  = null;
  exCompleted = false;
  clearInterval(exTimerID);
  document.getElementById("display").innerHTML = '<span class="cursor"></span>';
  autoSkipSpaces();
  renderExercise();
  renderExStats();
  if (exSentMode === "hear" || exSentMode === "both") speakSentence(exSentence);
}

function renderExercise() {
  const el = document.getElementById("exerciseTarget");
  if (exSentMode === "hear") {
    el.innerHTML = `<span class="ch-todo">${exTyped.length}/${exSentence.length} — typed from memory</span>`;
    return;
  }

  let typedHtml = "";
  let hasErrors = false;

  for (let i = 0; i < exSentence.length; i++) {
    const target = exSentence[i];
    const tgt    = target === " " ? "&nbsp;" : x(target);

    if (i < exTyped.length) {
      if (exTyped[i] === target) {
        typedHtml += `<span class="ch-ok">${tgt}</span>`;
      } else {
        hasErrors = true;
        const typed = exTyped[i] === " " ? "␣" : x(exTyped[i]);
        typedHtml += `<span class="ch-err">${typed}</span>`;
      }
    } else if (i === exTyped.length) {
      typedHtml += `<span class="ch-cur">${tgt}</span>`;
    } else {
      typedHtml += `<span class="ch-todo">${tgt}</span>`;
    }
  }

  // Reference line: show the target sentence when there are errors
  let refHtml = "";
  if (hasErrors) {
    refHtml = '<div class="ex-reference">';
    for (let i = 0; i < exSentence.length; i++) {
      const target = exSentence[i];
      const tgt    = target === " " ? "&nbsp;" : x(target);
      const isErr  = i < exTyped.length && exTyped[i] !== target;
      refHtml += `<span class="${isErr ? "ch-ref-err" : "ch-ref"}">${tgt}</span>`;
    }
    refHtml += '</div>';
  }

  el.innerHTML = typedHtml + refHtml;
}

function renderExStats() {
  const elapsed = exStartTime ? (Date.now() - exStartTime) / 60000 : 0;
  const correct = exTyped.filter((c, i) => c === exSentence[i]).length;
  const wpm = elapsed > 0.005 ? Math.round((correct / 5) / elapsed) : 0;
  const sec = elapsed > 0 ? Math.round(elapsed * 60) : 0;
  const dur = sec >= 60 ? `${Math.floor(sec/60)}m${sec%60}s` : `${sec}s`;
  document.getElementById("wpm").textContent      = wpm;
  document.getElementById("keyCount").textContent = exTyped.length;
  document.getElementById("duration").textContent  = exStartTime ? dur : "0s";
  document.getElementById("errCount").textContent  = exBackspaces;
}

function resolveChar(e, isNumpad) {
  const lyr = isNumpad ? NUMPAD_KEYS[e.code] : layout.keys[e.code];
  if (!lyr) return null;
  let ch = isNumpad ? (lyr[0] ?? null) :
           mods.altgr ? (lyr[2] ?? lyr[0]) :
           mods.shift  ? (lyr[1] ?? lyr[0]) :
                          lyr[0];
  if (!isNumpad && mods.caps && !mods.shift) {
    if (ch >= "a" && ch <= "z") ch = ch.toUpperCase();
    else if (ch >= "A" && ch <= "Z") ch = ch.toLowerCase();
  }
  return ch || null;
}

function autoSkipSpaces() {
  while (mode === "accountant"
      && exTyped.length < exSentence.length
      && exSentence[exTyped.length] === " ") {
    exTyped.push(" ");
  }
}

function handleExKey(e, isNumpad) {
  if (exCompleted) return;

  if (e.code === "Backspace") {
    if (exTyped.length > 0) {
      exTyped.pop();
      exBackspaces++;
      while (mode === "accountant" && exTyped.length > 0
          && exSentence[exTyped.length - 1] === " ") {
        exTyped.pop();
      }
    }
    renderExercise();
    renderExStats();
    return;
  }

  const raw = resolveChar(e, isNumpad);
  if (!raw) return;

  // In accountant mode, skip spaces in the sentence automatically
  if (mode === "accountant" && raw === " ") return;

  const chars = composeChar(raw);
  if (!chars.length) return;

  if (!exStartTime) {
    exStartTime = Date.now();
    exTimerID   = setInterval(renderExStats, 1000);
  }

  for (const ch of chars) {
    autoSkipSpaces();
    exTyped.push(ch);
    speak(ch);
  }
  autoSkipSpaces();
  renderExercise();
  renderExStats();

  if (exTyped.length >= exSentence.length) {
    clearInterval(exTimerID);
    exCompleted = true;
    setTimeout(showCompletion, 350);
  }
}

function getExResults() {
  const elapsed = exStartTime ? (Date.now() - exStartTime) / 60000 : 0;

  // In accountant mode, spaces are auto-filled — exclude them from scoring
  const indices = [...exSentence].map((c, i) => i)
    .filter(i => mode !== "accountant" || exSentence[i] !== " ");

  const remaining = indices.filter(i => (exTyped[i] ?? "") !== exSentence[i]).length;
  const scored    = indices.length;
  const correct   = scored - remaining;
  const wpm       = elapsed > 0.005 ? Math.round((correct / 5) / elapsed) : 0;
  const accuracy  = scored > 0
    ? Math.round((correct / (scored + exBackspaces)) * 100)
    : 0;
  const sec = elapsed > 0 ? Math.round(elapsed * 60) : 0;
  const dur = sec >= 60 ? `${Math.floor(sec/60)}m${sec%60}s` : `${sec}s`;
  return { wpm, accuracy, remaining, corrected: exBackspaces, dur };
}

function showCompletion() {
  exLastResults = getExResults();               // freeze results now
  const r = exLastResults;
  document.getElementById("modalStats").innerHTML = `
    <div class="stat"><div class="val">${r.wpm}</div><div class="lbl">WPM</div></div>
    <div class="stat"><div class="val">${r.accuracy}%</div><div class="lbl">Accuracy</div></div>
    <div class="stat"><div class="val">${r.remaining}</div><div class="lbl">Remaining</div></div>
    <div class="stat"><div class="val">${r.corrected}</div><div class="lbl">Corrections</div></div>
    <div class="stat"><div class="val">${r.dur}</div><div class="lbl">Time</div></div>
  `;
  const saved = localStorage.getItem("kbm_player") || "";
  document.getElementById("playerName").value = saved;
  document.getElementById("modalOverlay").hidden = false;
  setTimeout(() => document.getElementById("playerName").focus(), 50);
}

// ═══════════════════════════════════════════════════════════
//  HALL OF FAME
// ═══════════════════════════════════════════════════════════
async function hofFetch(m) {
  try {
    const r = await fetch(`hof.php?mode=${m}`);
    return r.ok ? r.json() : [];
  } catch { return []; }
}

async function hofPost(entry, m) {
  try {
    const r = await fetch('hof.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: m, entry }),
    });
    const j = await r.json();
    return j.entries ?? [];
  } catch { return []; }
}

function renderHof(m, entries) {
  const panelId = m === "accountant" ? "hofPanelAccount" : "hofPanelSentence";
  const tableId = m === "accountant" ? "hofTableAccount" : "hofTableSentence";
  const panel = document.getElementById(panelId);
  if (!entries.length) { panel.hidden = true; return; }
  panel.hidden = false;
  const medals = ["🥇","🥈","🥉"];
  document.getElementById(tableId).innerHTML = `
    <tr>
      <th>#</th><th>Name</th><th>WPM</th><th>Accuracy</th>
      <th title="Wrong chars at end">Remaining</th>
      <th title="Backspaces used">Corrections</th>
      <th>Pack</th><th>Date</th>
    </tr>
    ${entries.map((e, i) => `
      <tr class="${i < 3 ? "hof-rank-"+(i+1) : ""}">
        <td class="rank">${medals[i] ?? i+1}</td>
        <td class="name">${x(e.name)}</td>
        <td class="wpm">${e.wpm}</td>
        <td>${e.accuracy}%</td>
        <td>${e.remaining ?? 0}</td>
        <td>${e.corrected ?? 0}</td>
        <td class="muted">${x(e.pack ?? "")}</td>
        <td>${e.date}</td>
      </tr>`).join("")}
  `;
}

async function refreshHof(m) {
  renderHof(m, await hofFetch(m));
}

// ═══════════════════════════════════════════════════════════
//  CONTROLS
// ═══════════════════════════════════════════════════════════
const layoutSel = document.getElementById("layoutSel");
Object.entries(LAYOUTS).forEach(([id, l]) => {
  const o = document.createElement("option");
  o.value = id; o.textContent = l.name;
  o.selected = (id === CONFIG.defaultLayout);
  layoutSel.appendChild(o);
});
layoutSel.addEventListener("change", e => {
  layout = LAYOUTS[e.target.value];
  renderKeyboard();
  loadVoices();
  reset();
});

document.getElementById("btnAudio").addEventListener("click", function () {
  audioOn = !audioOn;
  this.textContent = audioOn ? "🔊 Audio" : "🔇 Audio";
  this.classList.toggle("on", audioOn);
  this.blur();
});

document.getElementById("btnAudioMode").addEventListener("click", function () {
  audioMode = audioMode === "key" ? "word" : "key";
  this.textContent = audioMode === "key" ? "Per key" : "Per word";
  this.classList.toggle("on", audioMode === "word");
  this.blur();
});

document.getElementById("btnBlind").addEventListener("click", function () {
  blindMode = !blindMode;
  document.getElementById("kbWrap").classList.toggle("blind", blindMode);
  this.textContent = blindMode ? "🙈 Blind mode" : "👁 Show keyboard";
  this.classList.toggle("on", blindMode);
  this.blur();
});

document.getElementById("btnClear").addEventListener("click", function () { reset(); this.blur(); });


// Mode cards
function activateMode(newMode) {
  const wasEx = mode !== "free";
  mode = (mode === newMode) ? "free" : newMode;   // toggle off if same
  const isEx = mode !== "free";

  // Set default pack when mode changes
  if (mode === "accountant") sentPackKey = "numpad";
  else if (mode === "sentence" && sentPackKey === "numpad") {
    sentPackKey = CONFIG.preferLang === "fr" ? "fr" : "en";
  }

  document.getElementById("btnModeSentence").classList.toggle("on", mode === "sentence");
  document.getElementById("btnModeAccount").classList.toggle("on",  mode === "accountant");
  document.getElementById("exercisePanel").hidden = !isEx;
  document.getElementById("statErrors").hidden    = !isEx;
  document.getElementById("display").hidden       = isEx;
  updateThemeSel();

  if (isEx) {
    if (mode === "accountant") {
      numpadVisible = true;
      document.getElementById("numpad").hidden = false;
    }
    startExercise();
  } else {
    clearInterval(exTimerID);
    reset();
  }
}

document.getElementById("btnModeSentence").addEventListener("click", function () {
  activateMode("sentence"); this.blur();
});
document.getElementById("btnModeAccount").addEventListener("click", function () {
  activateMode("accountant"); this.blur();
});

document.getElementById("themeSel").addEventListener("change", e => {
  sentPackKey = e.target.value;
  if (mode !== "free") startExercise();
});

// Sentence mode (See / Hear / Both)
["btnExSee","btnExHear","btnExBoth"].forEach(id => {
  document.getElementById(id).addEventListener("click", function () {
    exSentMode = { btnExSee:"see", btnExHear:"hear", btnExBoth:"both" }[id];
    document.getElementById("btnExSee").classList.toggle("on",  exSentMode === "see");
    document.getElementById("btnExHear").classList.toggle("on", exSentMode === "hear");
    document.getElementById("btnExBoth").classList.toggle("on", exSentMode === "both");
    startExercise();
    this.blur();
  });
});

document.getElementById("btnNewSentence").addEventListener("click", function () {
  startExercise(); this.blur();
});

document.getElementById("btnRepeat").addEventListener("click", function () {
  speakSentence(exSentence); this.blur();
});

// Modal: name entry + auto-save on Enter key or Next button
document.getElementById("playerName").addEventListener("keydown", e => {
  if (e.key === "Enter") saveAndNext();
  if (e.key === "Escape") {
    document.getElementById("modalOverlay").hidden = true;
    startExercise();
  }
});

document.getElementById("btnNextEx").addEventListener("click", function () {
  saveAndNext(); this.blur();
});

function setPlayerBadge(name) {
  const el = document.getElementById("playerBadge");
  if (name && name !== "Anonymous") {
    el.textContent = name;
    el.hidden = false;
    localStorage.setItem("kbm_player", name);
  }
}

async function saveAndNext() {
  const name = document.getElementById("playerName").value.trim() || "Anonymous";
  setPlayerBadge(name);
  const r   = exLastResults;
  const now = new Date();
  const date = now.toLocaleDateString() + ' '
             + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const hofMode = mode === "accountant" ? "accountant" : "sentence";
  const pack    = SENTENCE_PACKS[sentPackKey];
  const packTag = pack ? `${pack.code ?? sentPackKey} v${pack.version ?? 1}` : sentPackKey;
  const entries = await hofPost(
    { name, wpm: r.wpm, accuracy: r.accuracy,
      remaining: r.remaining, corrected: r.corrected, date, pack: packTag },
    hofMode
  );
  renderHof(hofMode, entries);
  logEvent('exercise_complete', {
    wpm: r.wpm, accuracy: r.accuracy, remaining: r.remaining,
    corrected: r.corrected, dur: r.dur, sentmode: exSentMode, pack: packTag,
  });
  document.getElementById("modalOverlay").hidden = true;
  startExercise();
}

function reset() {
  typed = []; startTime = null;
  clearInterval(timerID);
  renderDisplay();
  renderStats();
}

// ═══════════════════════════════════════════════════════════
//  LOGGING
// ═══════════════════════════════════════════════════════════
function logEvent(event, extra = {}) {
  fetch('log.php', {
    method:    'POST',
    headers:   { 'Content-Type': 'application/json' },
    body:      JSON.stringify({ event, layout: layout.region, ...extra }),
    keepalive: true,
  }).catch(() => {});
}

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
document.getElementById("badge").textContent        = CONFIG.instance;
document.getElementById("versionBadge").textContent = CONFIG.version;
document.title = `Keyboard Master — ${CONFIG.instance}`;
setPlayerBadge(localStorage.getItem("kbm_player") || "");
document.getElementById("numpad").hidden = true;
numpadVisible  = false;
numpadDetected = false;
renderKeyboard();
renderNumpad();
renderDisplay();
refreshHof("sentence");
refreshHof("accountant");
logEvent('visit');
</script>
